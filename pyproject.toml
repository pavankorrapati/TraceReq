[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reqora"
version = "0.1.2"
description = "AST-driven Python dependency discovery, resolution, and runtime provisioning engine."
readme = "README.md"

authors = [
    { name = "Pavan Kumar Korrapati", email = "pavankorrapati2205@gmail.com" }
]

requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/pavankorrapati/TraceReq"
Repository = "https://github.com/pavankorrapati/TraceReq.git"
"Bug Tracker" = "https://github.com/pavankorrapati/TraceReq/issues"

[project.scripts]
reqora = "auto_req.cli:main"