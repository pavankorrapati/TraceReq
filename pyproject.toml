[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-req"
version = "0.1.0"
description = "Automatic dependency detection and installer for Python and PyTest projects."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pavan_Korrapati" }
]
dependencies = []

[project.scripts]
auto-req = "auto_req.cli:main"

[project.entry-points."pytest11"]
auto_req = "auto_req.pytest_plugin"