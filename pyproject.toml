[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime-deps"                   # PyPI package name (pip install runtime-deps)
version = "0.1.0"
description = "AST-driven dynamic dependency resolution and runtime provisioning engine."
readme = "README.md"
authors = [{ name = "Pavan Kumar Korrapati" }]
requires-python = ">=3.10"
dependencies = [
    # Add any external libraries your tool requires (e.g., "requests")
]

[project.scripts]
runtime-deps = "auto_req.cli:main"      # Full command name
rtdeps = "auto_req.cli:main"            # Short, fast-to-type command alias